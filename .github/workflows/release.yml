# Build and publish shade-mcp dist as a GitHub Release tarball
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "Tag and package version agree: $pkg"

      - name: Install and build
        run: npm ci && npm run build

      - name: Create tarball
        run: tar -czf shade-mcp-dist.tar.gz -C dist .

      # `npm run build` already ran this against dist/. Running it again on the
      # unpacked tarball covers the step in between: `tar -C dist .` is what
      # decides the shape consumers receive, and portable extracts it flat and
      # runs index.js straight out of it. Verifying here rather than after
      # publishing means a drop that cannot start never becomes a release —
      # and since trigger-downstream.yml waits on the asset before dispatching,
      # no consumer can be handed a broken one.
      - name: Smoke-test the tarball as a vendored drop
        run: |
          rm -rf /tmp/drop && mkdir -p /tmp/drop
          tar -xzf shade-mcp-dist.tar.gz -C /tmp/drop
          node scripts/check-dist-selfcontained.mjs /tmp/drop

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: shade-mcp-dist.tar.gz
          generate_release_notes: true
